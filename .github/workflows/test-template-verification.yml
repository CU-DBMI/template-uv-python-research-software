---
name: template-verification

"on":
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-verification:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.11"
      - name: Exercise rendered Python verification
        run: uv run --frozen python scripts/check_verification.py

  rust-verification:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.11"
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.1
      - name: Install pinned Kani and its matching compiler
        run: |
          cargo install --locked kani-verifier --version 0.68.0
          cargo kani setup
      - name: Exercise rendered production harness
        run: uv run --frozen python scripts/check_verification.py --rust
