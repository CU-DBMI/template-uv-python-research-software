# copier.yaml
project_name:
  type: str
  help: >-
    What is the name of your project?
    This will be used in the package name
    and other places. Dashes will be converted
    to underscores for the Python package/module
    name (e.g. "my-project" -> "my_project").

project_description:
  type: str
  help: >-
    A short description of the project.
    This will be used in the package metadata
    and other places.

python_package_name:
  type: str
  default: "{{ project_name|replace('-', '_') }}"
  when: false

author_name:
  type: str
  default: "Your Name"
  help: >-
    Your name. This will be used
    in the package metadata and other places.

author_orcid:
  type: str
  default: "https://orcid.org/0000-0000-0000-0000"
  help: >-
    Your ORCID. This will be used in
    the package metadata and other places.

github_url:
  type: str
  default: "https://github.com/org/repo"
  help: >-
    The URL of the GitHub repository.
    This will be used in the package metadata
    and other places.

github_primary_reviewer:
  type: str
  default: "@your-github-handle"
  help: >-
    Primary GitHub reviewer handle for CODEOWNERS
    (for example: @octocat). This is used to route
    default review requests on pull requests.

use_rust:
  type: bool
  default: false
  help: >-
    Include optional high-performance Rust bindings (via PyO3 + maturin)?
    Choose "false" for a pure-Python project (built with setuptools and
    versioned dynamically from git tags via setuptools-scm). Choose "true"
    to add a Rust workspace with a native extension module: the Python
    package then calls into compiled Rust for the performance-critical work,
    the wheel is built with maturin, and the release version is taken from
    the Cargo workspace (synchronized from the release tag at publish time).

_exclude:
  - .git
  - .DS_Store
  - .svn
  - __pycache__
  - "*.py[co]"
  - "~*"
  - copier.yaml
  - renovate.json
  - tests/test_template.py
  - .github/workflows/test-template.yml

_envops:
  # Jinja settings to remove whitespace
  lstrip_blocks: true
  trim_blocks: true
